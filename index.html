<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Budget Tracker</title>
    <link rel="stylesheet" href="./src/css/main.css" />
  </head>
  <body>
    <div class="header">
      <h1>Budget Tracker</h1>
    </div>

    <div class="budget-tracker">
      <div class="transaction-list">
        <div class="transaction-header">
          <span>Amount</span>
          <span>Payment Type</span>
          <span>Description</span>
          <span></span>
          <span>Status</span>
        </div>

        <div class="transaction-form">
          <input type="number" class="transaction-amount" step="0.01" />
          <select class="transaction-type">
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>
          <input type="text" class="transaction-description" />
          <span></span>
          <button class="transaction-submit">Proceed</button>
        </div>

        <div class="transaction-container"></div>
      </div>

      <div class="balance">
        <div class="balance-income">
          <span>Income</span>
          <span class="balance-income-amount">$0.00</span>
        </div>
        <div class="balance-expense">
          <span>Expense</span>
          <span class="balance-expense-amount">$0.00</span>
        </div>
        <div class="balance-total">
          <span>Balance</span>
          <span class="balance-total-amount">$0.00</span>
        </div>
      </div>

      <div class="summary">
        <span class="summary-title">Activity</span>
        <div class="summary-success">
          <span class="summary-success-filter">Success</span>
        </div>
        <div class="summary-denied">
          <span class="summary-denied-filter">Denied</span>
        </div>
      </div>
    </div>

    <script type="module" src="./src/js/controller.js"></script>
  </body>
</html>
